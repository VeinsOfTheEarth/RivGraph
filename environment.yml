name: rivgraph
channels:
  - conda-forge
dependencies:
  - python=3.12
  - setuptools>=64
  - pip

  # Core scientific stack
  - numpy>=1.26,<2
  - scipy>=1.11,<1.14
  - pandas>=2.2,<2.3
  - matplotlib>=3.8,<3.11
  - networkx>=2.8,<3.3
  - scikit-image>=0.22,<0.25

  # Geospatial stack
  - shapely>=2.1,<2.2
  - geopandas>=1.1,<1.2
  - pyproj>=3.6,<3.8
  - rasterio>=1.4,<1.5
  - pyogrio>=0.11.1,<0.13

  # Existing project/runtime deps
  - contextily>=1.6,<2
  - pillow
  - pyyaml
  - loguru
  - fastdtw

  # Testing / packaging
  - pytest>=8,<9